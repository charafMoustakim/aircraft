<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aircraft Data - APN 206</title>
  <style>
    :root {
      --brand-red: #e30613;
      --brand-dark: #1f1f1f;
      --brand-light: #f7f7f8;
      --text: #222;
      --white: #fff;
      --border: #e5e5e5;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background: linear-gradient(180deg, #fafafa 0%, #f1f3f5 100%);
    }

    .topbar {
      background: var(--brand-red);
      color: var(--white);
      padding: 14px 20px;
      font-weight: 700;
      letter-spacing: 0.3px;
      font-size: 1.1rem;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
    }

    .container {
      max-width: 980px;
      margin: 28px auto;
      padding: 0 16px;
    }

    .hero {
      background: var(--white);
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      overflow: hidden;
      border: 1px solid #eee;
    }

    .hero-head {
      background: var(--brand-dark);
      color: var(--white);
      padding: 20px;
    }

    .hero-head h1 {
      margin: 0;
      font-size: 1.6rem;
      font-weight: 800;
    }

    .hero-head p {
      margin: 8px 0 0;
      opacity: 0.9;
      font-size: 0.95rem;
    }

    .content {
      padding: 18px;
      background: var(--brand-light);
    }

    .table-wrap {
      background: var(--white);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead th {
      background: var(--brand-red);
      color: var(--white);
      text-align: left;
      padding: 14px 16px;
      font-size: 0.95rem;
      letter-spacing: 0.2px;
    }

    tbody td {
      padding: 13px 16px;
      border-bottom: 1px solid #f0f0f0;
      font-size: 0.95rem;
    }

    tbody tr:nth-child(even) {
      background: #fcfcfc;
    }

    tbody tr:hover {
      background: #fff4f5;
    }

    .badge {
      display: inline-block;
      background: #ffe7e9;
      color: #b0000a;
      padding: 4px 10px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.82rem;
    }

    .cycle-input {
      width: 100%;
      min-width: 120px;
      padding: 8px 10px;
      border: 1px solid #d8d8d8;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
    }

    .cycle-input:focus {
      border-color: var(--brand-red);
      box-shadow: 0 0 0 2px rgba(227, 6, 19, 0.12);
    }

    .actions {
      margin-top: 14px;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .btn {
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--brand-red);
      color: #fff;
      box-shadow: 0 4px 12px rgba(227, 6, 19, 0.25);
    }

    .btn-secondary {
      background: #2f2f2f;
      color: #fff;
    }

    .btn:hover {
      filter: brightness(0.96);
    }

    .status-msg {
      width: 100%;
      font-size: 0.88rem;
      color: #333;
      text-align: right;
      margin-top: 6px;
    }

    .footer-note {
      margin-top: 10px;
      font-size: 0.85rem;
      color: #666;
      text-align: right;
    }

    @media (max-width: 640px) {
      .hero-head h1 {
        font-size: 1.25rem;
      }

      thead th, tbody td {
        padding: 11px 10px;
      }

      .topbar {
        font-size: 1rem;
      }

      .actions {
        justify-content: stretch;
      }

      .btn {
        width: 100%;
      }

      .status-msg {
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <div class="topbar">APN 206</div>

  <main class="container">
    <section class="hero">
      <div class="hero-head">
        <h1>Aircraft Data</h1>
        <p>Fleet reference table inspired by airline booking portal UI style.</p>
      </div>

      <div class="content">
        <div class="table-wrap">
          <table aria-label="Aircraft Data">
            <thead>
              <tr>
                <th style="width: 30%;">A/C</th>
                <th style="width: 18%;">AC-Type</th>
                <th style="width: 20%;">Last cycle count</th>
                <th>Number of cycle of the current day</th>
              </tr>
            </thead>
            <tbody id="aircraftTableBody"></tbody>
          </table>
        </div>

        <div class="actions">
          <button id="loadGithubBtn" class="btn btn-secondary" type="button">Load data.xlsx from GitHub</button>
          <button id="saveBtn" class="btn btn-primary" type="button">Save Weekly Data (Download)</button>
          <div id="saveStatus" class="status-msg"></div>
        </div>

        <div class="footer-note">Total aircraft: <span id="totalCount">0</span></div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script>
    const aircraftData = [
      { ac: "CN-NMH", type: "A320" },
      { ac: "CN-NMI", type: "A320" },
      { ac: "CN-NMJ", type: "A320" },
      { ac: "CN-NML", type: "A320" },
      { ac: "CN-NMN", type: "A320" },
      { ac: "CN-NMO", type: "A320" },
      { ac: "CN-NMP", type: "A320" },
      { ac: "CN-NMQ", type: "A320" },
      { ac: "CN-NMS", type: "A320" },
      { ac: "CN-NMT", type: "A320" }
    ];

    const tableBody = document.getElementById("aircraftTableBody");
    const totalCount = document.getElementById("totalCount");
    const loadGithubBtn = document.getElementById("loadGithubBtn");
    const saveBtn = document.getElementById("saveBtn");
    const saveStatus = document.getElementById("saveStatus");

    const GITHUB_RAW_XLSX_URL = "https://github.com/charafMoustakim/aircraft/blob/1a9f556709e562fc98ed4321e59631e3292b03f0/data.xlsx";
    let workbook = null;
    let sheetName = "CycleData";

    function getWeekNumber(date = new Date()) {
      const tempDate = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
      const dayNum = tempDate.getUTCDay() || 7;
      tempDate.setUTCDate(tempDate.getUTCDate() + 4 - dayNum);
      const yearStart = new Date(Date.UTC(tempDate.getUTCFullYear(), 0, 1));
      return Math.ceil((((tempDate - yearStart) / 86400000) + 1) / 7);
    }

    aircraftData.forEach((item, index) => {
      const row = document.createElement("tr");
      row.innerHTML = `
        <td><strong>${item.ac}</strong></td>
        <td><span class="badge">${item.type}</span></td>
        <td><span class="badge" data-last-cycle="${item.ac}">-</span></td>
        <td>
          <input
            class="cycle-input"
            type="number"
            min="0"
            step="1"
            value="0"
            data-index="${index}"
            aria-label="Number of cycle of the current day for ${item.ac}"
          />
        </td>
      `;
      tableBody.appendChild(row);
    });

    totalCount.textContent = aircraftData.length;

    function toNumber(value) {
      const n = Number(value);
      return Number.isFinite(n) ? n : null;
    }

    function extractLatestCycles(rows) {
      const latest = {};
      rows.forEach((row, idx) => {
        const ac = String(row.Aircraft ?? row["A/C"] ?? row.ac ?? "").trim();
        if (!ac) return;

        const cycleVal = toNumber(
          row["Number of cycle of the current day"] ??
          row["Last cycle count"] ??
          row.cycles
        );

        const weekVal = toNumber(row.Week);
        const yearVal = toNumber(row.Year);
        const order = (yearVal ?? 0) * 100 + (weekVal ?? 0) + idx / 10000;

        if (!latest[ac]) {
          latest[ac] = { cycle: cycleVal, order };
        } else if (order >= latest[ac].order) {
          latest[ac] = { cycle: cycleVal, order };
        }
      });

      const result = {};
      Object.keys(latest).forEach((ac) => {
        result[ac] = latest[ac].cycle;
      });
      return result;
    }

    function renderLastCycleCounts(cycleMap) {
      aircraftData.forEach((item) => {
        const el = document.querySelector(`[data-last-cycle="${item.ac}"]`);
        if (!el) return;
        const value = cycleMap[item.ac];
        el.textContent = value === null || value === undefined ? "-" : String(value);
      });
    }

    async function loadFromGitHub() {
      try {
        saveStatus.textContent = "Loading from GitHub...";
        saveStatus.style.color = "#333";

        const response = await fetch(GITHUB_RAW_XLSX_URL, { cache: "no-store", mode: "cors" });
        if (!response.ok) {
          throw new Error(`Failed to fetch GitHub file (${response.status})`);
        }

        const buffer = await response.arrayBuffer();
        workbook = XLSX.read(buffer, { type: "array" });
        sheetName = workbook.SheetNames[0] || "CycleData";

        const sheet = workbook.Sheets[sheetName];
        const rows = sheet ? XLSX.utils.sheet_to_json(sheet) : [];
        const lastCycles = extractLatestCycles(rows);
        renderLastCycleCounts(lastCycles);

        saveStatus.textContent = "GitHub data loaded successfully.";
        saveStatus.style.color = "#0a7a2f";
      } catch (error) {
        saveStatus.textContent = "CORS blocked when opening via file://. Start a local static server, then reload. Example: `py -m http.server 5500` and open http://localhost:5500/index.html";
        saveStatus.style.color = "#b00020";
        console.error("Load error:", error);
      }
    }

    async function saveWeeklyData() {
      try {
        saveStatus.textContent = "Preparing Excel download...";
        saveStatus.style.color = "#333";

        if (!workbook) {
          workbook = XLSX.utils.book_new();
          sheetName = "CycleData";
          workbook.Sheets[sheetName] = XLSX.utils.json_to_sheet([]);
          workbook.SheetNames = [sheetName];
        }

        const existingSheet = workbook.Sheets[sheetName];
        const existingData = existingSheet ? XLSX.utils.sheet_to_json(existingSheet) : [];

        const now = new Date();
        const dateStr = now.toISOString().split("T")[0];
        const weekNumber = getWeekNumber(now);
        const year = now.getFullYear();

        const cycleInputs = document.querySelectorAll(".cycle-input");
        const newRows = aircraftData.map((item, idx) => ({
          Date: dateStr,
          Year: year,
          Week: weekNumber,
          Aircraft: item.ac,
          "AC-Type": item.type,
          "Number of cycle of the current day": Number(cycleInputs[idx].value || 0)
        }));

        const merged = [...existingData, ...newRows];
        workbook.Sheets[sheetName] = XLSX.utils.json_to_sheet(merged);
        if (!workbook.SheetNames.includes(sheetName)) {
          workbook.SheetNames.push(sheetName);
        }

        const lastCycles = extractLatestCycles(merged);
        renderLastCycleCounts(lastCycles);

        const outArray = XLSX.write(workbook, { type: "array", bookType: "xlsx" });
        const blob = new Blob([outArray], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });

        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = "data.xlsx";
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(link.href);

        saveStatus.textContent = `Saved ${newRows.length} rows. Downloaded updated data.xlsx`;
        saveStatus.style.color = "#0a7a2f";
      } catch (error) {
        saveStatus.textContent = `Error: ${error.message}`;
        saveStatus.style.color = "#b00020";
      }
    }

    loadGithubBtn.addEventListener("click", loadFromGitHub);
    saveBtn.addEventListener("click", saveWeeklyData);

    loadFromGitHub();
  </script>
</body>
</html>
