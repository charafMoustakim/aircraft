<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aircraft Data - APN 206</title>
  <style>
    :root {
      --brand-red: #e30613;
      --brand-dark: #1f1f1f;
      --brand-light: #f7f7f8;
      --text: #222;
      --white: #fff;
      --border: #e5e5e5;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background: linear-gradient(180deg, #fafafa 0%, #f1f3f5 100%);
    }

    .topbar {
      background: var(--brand-red);
      color: var(--white);
      padding: 14px 20px;
      font-weight: 700;
      letter-spacing: 0.3px;
      font-size: 1.1rem;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
    }

    .container {
      max-width: 980px;
      margin: 28px auto;
      padding: 0 16px;
    }

    .hero {
      background: var(--white);
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      overflow: hidden;
      border: 1px solid #eee;
    }

    .hero-head {
      background: var(--brand-dark);
      color: var(--white);
      padding: 20px;
    }

    .hero-head h1 {
      margin: 0;
      font-size: 1.6rem;
      font-weight: 800;
    }

    .hero-head p {
      margin: 8px 0 0;
      opacity: 0.9;
      font-size: 0.95rem;
    }

    .content {
      padding: 18px;
      background: var(--brand-light);
    }

    .table-wrap {
      background: var(--white);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead th {
      background: var(--brand-red);
      color: var(--white);
      text-align: left;
      padding: 14px 16px;
      font-size: 0.95rem;
      letter-spacing: 0.2px;
    }

    tbody td {
      padding: 13px 16px;
      border-bottom: 1px solid #f0f0f0;
      font-size: 0.95rem;
    }

    tbody tr:nth-child(even) {
      background: #fcfcfc;
    }

    tbody tr:hover {
      background: #fff4f5;
    }

    .badge {
      display: inline-block;
      background: #ffe7e9;
      color: #b0000a;
      padding: 4px 10px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.82rem;
    }

    .cycle-input {
      width: 100%;
      min-width: 120px;
      padding: 8px 10px;
      border: 1px solid #d8d8d8;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
    }

    .cycle-input:focus {
      border-color: var(--brand-red);
      box-shadow: 0 0 0 2px rgba(227, 6, 19, 0.12);
    }

    .token-row {
      margin-top: 14px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }

    .token-input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d8d8d8;
      border-radius: 10px;
      font-size: 0.9rem;
      outline: none;
    }

    .token-input:focus {
      border-color: var(--brand-red);
      box-shadow: 0 0 0 2px rgba(227, 6, 19, 0.12);
    }

    .actions {
      margin-top: 14px;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .btn {
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--brand-red);
      color: #fff;
      box-shadow: 0 4px 12px rgba(227, 6, 19, 0.25);
    }

    .btn-secondary {
      background: #2f2f2f;
      color: #fff;
    }

    .btn:hover {
      filter: brightness(0.96);
    }

    .status-msg {
      width: 100%;
      font-size: 0.88rem;
      color: #333;
      text-align: right;
      margin-top: 6px;
      white-space: pre-wrap;
    }

    .footer-note {
      margin-top: 10px;
      font-size: 0.85rem;
      color: #666;
      text-align: right;
    }

    @media (max-width: 640px) {
      .hero-head h1 {
        font-size: 1.25rem;
      }

      thead th, tbody td {
        padding: 11px 10px;
      }

      .topbar {
        font-size: 1rem;
      }

      .actions {
        justify-content: stretch;
      }

      .btn {
        width: 100%;
      }

      .status-msg {
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <div class="topbar">APN 206</div>

  <main class="container">
    <section class="hero">
      <div class="hero-head">
        <h1>Aircraft Data</h1>
        <p>Fleet reference table inspired by airline booking portal UI style.</p>
      </div>

      <div class="content">
        <div class="table-wrap">
          <table aria-label="Aircraft Data">
            <thead>
              <tr>
                <th style="width: 30%;">A/C</th>
                <th style="width: 18%;">AC-Type</th>
                <th style="width: 20%;">Last cycle count</th>
                <th>Number of cycle of the current day</th>
              </tr>
            </thead>
            <tbody id="aircraftTableBody"></tbody>
          </table>
        </div>

       
        <div class="token-row">
          <input id="githubToken" class="token-input" type="password" placeholder="GitHub Personal Access Token (repo scope)" />
        </div>

        <div class="actions">
          <button id="loadGithubBtn" class="btn btn-secondary" type="button">Load data.csv from GitHub</button>
          <button id="saveGithubBtn" class="btn btn-primary" type="button">Save Weekly Data to GitHub</button>
          <div id="saveStatus" class="status-msg"></div>
        </div>

        <div class="footer-note">Total aircraft: <span id="totalCount">0</span></div>
      </div>
    </section>
  </main>

  <script>
    const aircraftData = [
      { ac: "CN-NMH", type: "A320" },
      { ac: "CN-NMI", type: "A320" },
      { ac: "CN-NMJ", type: "A320" },
      { ac: "CN-NML", type: "A320" },
      { ac: "CN-NMN", type: "A320" },
      { ac: "CN-NMO", type: "A320" },
      { ac: "CN-NMP", type: "A320" },
      { ac: "CN-NMQ", type: "A320" },
      { ac: "CN-NMS", type: "A320" },
      { ac: "CN-NMT", type: "A320" }
    ];

    const tableBody = document.getElementById("aircraftTableBody");
    const totalCount = document.getElementById("totalCount");
    const loadGithubBtn = document.getElementById("loadGithubBtn");
    const saveGithubBtn = document.getElementById("saveGithubBtn");
    const githubTokenInput = document.getElementById("githubToken");
    const saveStatus = document.getElementById("saveStatus");

    const OWNER = "charafMoustakim";
    const REPO = "aircraft";
    const BRANCH = "main";
    const FILE_PATH = "data.csv";
    const GITHUB_CONTENT_API_URL = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE_PATH}?ref=${encodeURIComponent(BRANCH)}`;
    const GITHUB_RAW_CSV_URL = `https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/${FILE_PATH}`;

    let csvRows = [];

    function getWeekNumber(date = new Date()) {
      const tempDate = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
      const dayNum = tempDate.getUTCDay() || 7;
      tempDate.setUTCDate(tempDate.getUTCDate() + 4 - dayNum);
      const yearStart = new Date(Date.UTC(tempDate.getUTCFullYear(), 0, 1));
      return Math.ceil((((tempDate - yearStart) / 86400000) + 1) / 7);
    }

    function toNumber(value) {
      const n = Number(value);
      return Number.isFinite(n) ? n : null;
    }

    function parseCSVLine(line) {
      const out = [];
      let current = "";
      let inQuotes = false;

      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (ch === '"') {
          if (inQuotes && line[i + 1] === '"') {
            current += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (ch === "," && !inQuotes) {
          out.push(current);
          current = "";
        } else {
          current += ch;
        }
      }
      out.push(current);
      return out;
    }

    function parseCSV(text) {
      const lines = text.replace(/\r\n/g, "\n").replace(/\r/g, "\n").split("\n").filter(l => l.trim() !== "");
      if (lines.length === 0) return [];

      const headers = parseCSVLine(lines[0]).map(h => h.trim());
      const rows = [];

      for (let i = 1; i < lines.length; i++) {
        const values = parseCSVLine(lines[i]);
        const row = {};
        headers.forEach((h, idx) => {
          row[h] = (values[idx] ?? "").trim();
        });
        rows.push(row);
      }

      return rows;
    }

    function csvEscape(value) {
      const str = String(value ?? "");
      if (str.includes(",") || str.includes('"') || str.includes("\n")) {
        return `"${str.replace(/"/g, '""')}"`;
      }
      return str;
    }

    function toCSV(rows) {
      const headers = ["Date", "Year", "Week", "Aircraft", "AC-Type", "Number of cycle of the current day"];
      const lines = [headers.join(",")];
      rows.forEach((row) => {
        const line = headers.map((h) => csvEscape(row[h] ?? "")).join(",");
        lines.push(line);
      });
      return lines.join("\n");
    }

    function extractTotalCycles(rows) {
      const totals = {};
      rows.forEach((row) => {
        const ac = String(row.Aircraft ?? row["A/C"] ?? row.ac ?? "").trim();
        if (!ac) return;

        const cycleVal = toNumber(
          row["Number of cycle of the current day"] ??
          row["Last cycle count"] ??
          row.cycles
        );

        const safeCycle = cycleVal ?? 0;
        totals[ac] = (totals[ac] ?? 0) + safeCycle;
      });

      return totals;
    }

    function renderLastCycleCounts(cycleMap) {
      aircraftData.forEach((item) => {
        const el = document.querySelector(`[data-last-cycle="${item.ac}"]`);
        if (!el) return;
        const value = cycleMap[item.ac];
        el.textContent = value === null || value === undefined ? "-" : String(value);
      });
    }

    function textToBase64(text) {
      return btoa(unescape(encodeURIComponent(text)));
    }

    function base64ToUtf8(base64) {
      const normalized = String(base64 || "").replace(/\n/g, "");
      return decodeURIComponent(escape(atob(normalized)));
    }

    async function getCurrentGithubFileMeta(token) {
      const headers = {
        Accept: "application/vnd.github+json"
      };
      if (token) {
        headers.Authorization = `Bearer ${token}`;
      }

      const response = await fetch(`${GITHUB_CONTENT_API_URL}&t=${Date.now()}`, {
        headers,
        cache: "no-store"
      });

      if (!response.ok) {
        throw new Error(`GitHub metadata fetch failed (${response.status})`);
      }
      return response.json();
    }

    async function loadFromGitHub() {
      try {
        saveStatus.textContent = "Loading latest data.csv from GitHub main...";
        saveStatus.style.color = "#333";

        let csvText = "";
        let loadedSha = "";

        let rawOk = false;
        try {
          const rawResponse = await fetch(`${GITHUB_RAW_CSV_URL}?t=${Date.now()}`, {
            cache: "no-store"
          });

          if (rawResponse.ok) {
            const rawText = await rawResponse.text();
            const firstLine = (rawText.split(/\r?\n/)[0] || "").toLowerCase();
            const looksLikeCsv = firstLine.includes(",") && (
              firstLine.includes("aircraft") ||
              firstLine.includes("a/c") ||
              firstLine.includes("ac-type")
            );

            if (rawText.trim().length > 0 && looksLikeCsv) {
              csvText = rawText;
              rawOk = true;
            }
          }
        } catch (rawErr) {
          rawOk = false;
        }

        if (!rawOk) {
          const token = githubTokenInput.value.trim();
          if (!token) {
            throw new Error("Public raw CSV could not be loaded. Provide a GitHub token to use API fallback.");
          }

          const meta = await getCurrentGithubFileMeta(token);

          if (meta && meta.content) {
            csvText = base64ToUtf8(meta.content);
            loadedSha = String(meta.sha || "");
          } else if (meta && meta.download_url) {
            const response = await fetch(`${meta.download_url}?t=${Date.now()}`, {
              cache: "no-store"
            });
            if (!response.ok) {
              throw new Error(`Failed to fetch CSV content (${response.status})`);
            }
            csvText = await response.text();
            loadedSha = String(meta.sha || "");
          } else {
            throw new Error("GitHub response does not include content or download_url");
          }
        }

        csvRows = parseCSV(csvText);
        const totalCycles = extractTotalCycles(csvRows);
        renderLastCycleCounts(totalCycles);

        saveStatus.textContent = loadedSha
          ? `Latest main branch CSV loaded (sha: ${loadedSha.slice(0, 7)})`
          : "Latest main branch CSV loaded from raw URL.";
        saveStatus.style.color = "#0a7a2f";
      } catch (error) {
        saveStatus.textContent = `Load error: ${error.message}.`;
        saveStatus.style.color = "#b00020";
      }
    }

    async function saveWeeklyDataToGitHub() {
      try {
        const token = githubTokenInput.value.trim();
        if (!token) {
          throw new Error("GitHub token is required.");
        }

        saveStatus.textContent = "Preparing updated CSV...";
        saveStatus.style.color = "#333";

        if (!csvRows || csvRows.length === 0) {
          await loadFromGitHub();
        }

        const now = new Date();
        const dateStr = now.toISOString().split("T")[0];
        const weekNumber = getWeekNumber(now);
        const year = now.getFullYear();

        const cycleInputs = document.querySelectorAll(".cycle-input");
        const newRows = aircraftData.map((item, idx) => ({
          Date: dateStr,
          Year: String(year),
          Week: String(weekNumber),
          Aircraft: item.ac,
          "AC-Type": item.type,
          "Number of cycle of the current day": String(Number(cycleInputs[idx].value || 0))
        }));

        const merged = [...csvRows, ...newRows];
        const contentCsv = toCSV(merged);
        const contentBase64 = textToBase64(contentCsv);

        saveStatus.textContent = "Pushing CSV update to GitHub...";
        const meta = await getCurrentGithubFileMeta(token);

        const putBody = {
          message: `Update aircraft cycles CSV (${new Date().toISOString()})`,
          content: contentBase64,
          sha: meta.sha,
          branch: BRANCH
        };

        const putResponse = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE_PATH}`, {
          method: "PUT",
          headers: {
            Authorization: `Bearer ${token}`,
            Accept: "application/vnd.github+json",
            "Content-Type": "application/json"
          },
          body: JSON.stringify(putBody)
        });

        if (!putResponse.ok) {
          const errText = await putResponse.text();
          throw new Error(`GitHub save failed (${putResponse.status}): ${errText}`);
        }

        csvRows = merged;
        const totalCycles = extractTotalCycles(csvRows);
        renderLastCycleCounts(totalCycles);

        saveStatus.textContent = `Saved ${newRows.length} rows to GitHub data.csv successfully.`;
        saveStatus.style.color = "#0a7a2f";
      } catch (error) {
        saveStatus.textContent = `Save error: ${error.message}`;
        saveStatus.style.color = "#b00020";
      }
    }

    aircraftData.forEach((item, index) => {
      const row = document.createElement("tr");
      row.innerHTML = `
        <td><strong>${item.ac}</strong></td>
        <td><span class="badge">${item.type}</span></td>
        <td><span class="badge" data-last-cycle="${item.ac}">-</span></td>
        <td>
          <input
            class="cycle-input"
            type="number"
            min="0"
            step="1"
            value="0"
            data-index="${index}"
            aria-label="Number of cycle of the current day for ${item.ac}"
          />
        </td>
      `;
      tableBody.appendChild(row);
    });

    totalCount.textContent = aircraftData.length;

    loadGithubBtn.addEventListener("click", loadFromGitHub);
    saveGithubBtn.addEventListener("click", saveWeeklyDataToGitHub);

    loadFromGitHub();
  </script>
</body>
</html>
